name: Daily maintenance

# 23:13 WIB daily: check the Instagram connection and record likes/comments
# so the agent learns your best times. (The Meta system-user token never expires.)
on:
  schedule:
    - cron: "13 16 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: repo-writes
  cancel-in-progress: false

jobs:
  maintain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check Instagram connection
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: "17841400521149190"
        run: python3 scripts/publish.py --check

      - name: Update post stats
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: "17841400521149190"
        run: python3 scripts/publish.py --stats

      - name: Save stats to repo
        run: |
          git config user.name "ig-publisher-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -q -m "Maintenance: update post stats"
          for i in 1 2 3; do git pull -q --rebase && git push -q && break; sleep 5; done
